# homewatch — see README.md for the install steps.
name: homewatch

services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:  # host ports: HW_HTTP_PORT and HW_HTTPS_PORT in .env
      - "${HW_HTTP_PORT:-5080}:80"
      - "${HW_HTTPS_PORT:-5443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
    environment:
      HW_TRUSTED_PROXIES: ${HW_TRUSTED_PROXIES:-}
      HW_HTTPS_PORT: ${HW_HTTPS_PORT:-5443}  # where the HTTP port sends browsers
    networks: [edge]
    depends_on:
      - controller
    read_only: true
    tmpfs: [/tmp, /config]

  controller:
    image: ghcr.io/nikosiaf/homewatch:${HW_VERSION:-0.38.2}
    restart: unless-stopped
    env_file: .env
    environment:
      HW_VM_URL: http://victoriametrics:8428
      HW_DATA_DIR: /data
      HW_TELEGRAF_DIR: /telegraf
      HW_GRAFANA_DIR: /grafana
      FORWARDED_ALLOW_IPS: ${HW_EDGE_SUBNET:-172.30.77.0/29}  # only Caddy shares this network
    networks: [edge, default]
    volumes:
      - hw-data:/data
      - telegraf-config:/telegraf
      - grafana-provisioning:/grafana  # the data source and dashboards for Grafana, written by homewatch
      - ./update:/update  # the host's updater (install.sh): homewatch only leaves a request in update/ask/
    depends_on:
      - victoriametrics
    read_only: true
    tmpfs: [/tmp]

  telegraf:
    image: telegraf:1.40.2
    restart: unless-stopped
    command: ["telegraf", "--config", "/telegraf/telegraf.conf", "--watch-config", "poll"]
    volumes:
      - telegraf-config:/telegraf:ro
    cap_add: [NET_RAW]
    depends_on:
      controller:
        condition: service_healthy
      victoriametrics:
        condition: service_started

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    restart: unless-stopped
    command: ["-storageDataPath=/storage", "-retentionPeriod=${HW_RETENTION:-1y}", "-httpListenAddr=:8428"]
    networks: [edge, default]  # edge: for Grafana
    volumes:
      - vm-data:/storage

  # Optional: COMPOSE_PROFILES=grafana in .env (System → Grafana, or install.sh) starts it.
  # Reached at https://<homewatch>/grafana/ with the homewatch login; not published on its own port.
  grafana:
    image: grafana/grafana:13.2.2
    profiles: [grafana]
    restart: unless-stopped
    networks: [edge]  # only this network, which it trusts for the user header (Caddy and homewatch)
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-Webauth-User
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: "Role:X-Webauth-Role"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: ${HW_EDGE_SUBNET:-172.30.77.0/29}  # Caddy, homewatch and VictoriaMetrics only
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: system
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/homewatch/overview.json
    volumes:
      - grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      controller:
        condition: service_healthy  # it has written the data source and dashboards by then
      victoriametrics:
        condition: service_started

networks:
  edge:
    ipam:
      config:
        - subnet: ${HW_EDGE_SUBNET:-172.30.77.0/29}

volumes:
  hw-data:
  caddy-data:
  telegraf-config:
  vm-data:
  grafana-provisioning:
  grafana-data:
