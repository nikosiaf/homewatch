{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card narrow">
  <div class="hero"><img src="/static/homewatch-icon.svg" alt="" width="56" height="56">
    <span class="wordmark big"><b>home</b><span><svg class="w-bino" viewBox="-2 -1 54 42" role="img" aria-label="W"><path d="M3.5 4.5Q3.5 1.5 6.5 1.5L11 1.5Q13 1.5 13.9 3.3L20 17.5L8 20Z" fill="currentColor"/><path d="M46.5 4.5Q46.5 1.5 43.5 1.5L39 1.5Q37 1.5 36.1 3.3L30 17.5L42 20Z" fill="currentColor"/><path d="M19.6 19L25 10.5L30.4 19" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="13.5" cy="28.5" r="10.6" fill="currentColor"/><circle cx="13.5" cy="28.5" r="6.9" fill="#38bdf8"/><circle cx="11.1" cy="26.0" r="2.1" fill="#fff" opacity=".92"/><circle cx="36.5" cy="28.5" r="10.6" fill="currentColor"/><circle cx="36.5" cy="28.5" r="6.9" fill="#38bdf8"/><circle cx="34.1" cy="26.0" r="2.1" fill="#fff" opacity=".92"/></svg>atch</span></span></div>
  <h1>{{ home }}</h1>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="u">Username</label><input id="u" type="text" name="username" autocomplete="username" required autofocus>
    <label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required>
    <p><button>Log in</button></p>
  </form>
</div>
{% endblock %}
