{% extends "base.html" %}
{% block title %}Password{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Change password</h1>
  <form method="post" action="/password">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="c">Current password</label><input id="c" type="password" name="current" required autocomplete="current-password">
    <label for="n">New password (10+ characters)</label><input id="n" type="password" name="new" minlength="10" required autocomplete="new-password">
    <label for="n2">New password again</label><input id="n2" type="password" name="new2" minlength="10" required autocomplete="new-password">
    <p><button>Change password</button></p>
  </form>
</div>
{% endblock %}
