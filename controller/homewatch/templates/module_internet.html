{% extends "base.html" %}
{% from "_note.html" import note with context %}
{% block title %}Internet{% endblock %}
{% block content %}
<h1><a href="/modules" class="quiet" style="text-decoration:none">Modules</a> › {{ module.name }}</h1>
<form method="post" action="/modules/internet" class="card" id="settings">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="_box" value="settings">
  {{ note("settings") }}
  {% include "_internet_form.html" %}
  <button data-save data-ookla-installed="{{ '1' if ookla_found else '' }}">Save</button>
</form>
<h2>Speed tests</h2>
{% include "_speedtests.html" %}
{% endblock %}
