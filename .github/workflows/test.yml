name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r controller/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: controller
  stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack from source
        working-directory: deploy
        run: |
          ./install.sh --dev
          for i in $(seq 1 30); do
            curl -skf https://localhost:5443/healthz && break
            sleep 2
          done
          curl -skf https://localhost:5443/healthz
          curl -sk -o /dev/null -w '%{http_code} %{redirect_url}\n' https://localhost:5443/ | grep -q '^303'
          # the HTTP port only sends browsers on to the HTTPS port
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost:5080/x | grep -qx '308 https://localhost:5443/x'
      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs --tail 50
