name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt && python -m pytest -q
        working-directory: controller
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: controller
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/nikosiaf/homewatch:${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: GitHub release with the deploy files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i "s/^HW_VERSION=.*/HW_VERSION=${{ steps.v.outputs.version }}/" deploy/.env.example
          cp deploy/.env.example deploy/env.example  # GitHub would rename ".env.example" to "default.env.example"
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            deploy/docker-compose.yml deploy/Caddyfile deploy/env.example deploy/install.sh
